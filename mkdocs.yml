site_name: Lumidepth Player VR
site_description: 手持ちの VR 動画に、AI で奥行きを足して見る PC VR プレイヤー
site_url: https://monmac1111.github.io/lumidepth-help/
repo_url: https://github.com/monmac1111/lumidepth-help
theme:
  name: material
  language: ja
  logo: icon.png
  favicon: icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: light blue
      toggle: { icon: material/weather-night, name: ダークモードへ }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light blue
      toggle: { icon: material/weather-sunny, name: ライトモードへ }
  features: [navigation.sections, navigation.top]
nav:
  - Lumidepth Player VR: index.md
  - 日本語:
      - ヘルプ: ja/help.md
      - プライバシーポリシー: ja/privacy.md
  - English:
      - Help: en/help.md
      - Privacy Policy: en/privacy.md
  - 简体中文:
      - 帮助: zh-Hans/help.md
      - 隐私政策: zh-Hans/privacy.md
  - 繁體中文:
      - 說明: zh-Hant/help.md
      - 隱私權政策: zh-Hant/privacy.md
  - 한국어:
      - 도움말: ko/help.md
      - 개인정보 처리방침: ko/privacy.md
  - Deutsch:
      - Hilfe: de/help.md
      - Datenschutzerklärung: de/privacy.md
  - Français:
      - Aide: fr/help.md
      - Politique de confidentialité: fr/privacy.md
  - Español:
      - Ayuda: es/help.md
      - Política de privacidad: es/privacy.md
  - Português (Brasil):
      - Ajuda: pt-BR/help.md
      - Política de Privacidade: pt-BR/privacy.md
  - Italiano:
      - Guida: it/help.md
      - Informativa sulla privacy: it/privacy.md
markdown_extensions: [admonition, tables, attr_list]
